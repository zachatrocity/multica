name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android version name to embed in the APK.
        required: false
      version_code:
        description: Positive integer Android version code to embed in the APK.
        required: false
  push:
    branches: [main]
    tags:
      - "v*.*.*"
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      APP_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve Android release metadata
        id: android_meta
        run: |
          set -euo pipefail

          input_version_name="${{ github.event.inputs.version_name }}"
          input_version_code="${{ github.event.inputs.version_code }}"

          if [[ -n "$input_version_name" ]]; then
            version_name="$input_version_name"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version_name="${GITHUB_REF_NAME#v}"
          else
            version_name="0.1.0-${GITHUB_RUN_NUMBER}"
          fi

          if [[ -n "$input_version_code" ]]; then
            version_code="$input_version_code"
          else
            version_code="$GITHUB_RUN_NUMBER"
          fi

          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Android version_code must be a positive integer; got '$version_code'."
            exit 1
          fi

          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

          {
            echo "EXPO_VERSION_NAME=$version_name"
            echo "EXPO_ANDROID_VERSION_CODE=$version_code"
          } >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write production env
        working-directory: apps/mobile
        run: |
          cat > .env.production.local <<EOF
          EXPO_PUBLIC_API_URL=${{ secrets.SELFHOSTED_API_URL }}
          EXPO_PUBLIC_WEB_URL=${{ secrets.SELFHOSTED_WEB_URL }}
          EOF

      - name: Generate Android native project
        working-directory: apps/mobile
        run: CI=1 pnpm exec dotenv -e .env.production.local -- cross-env APP_ENV=production expo prebuild --platform android --no-install --clean

      - name: Configure Android release signing
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" || -z "$ANDROID_RELEASE_KEY_ALIAS" || -z "$ANDROID_RELEASE_KEY_PASSWORD" || -z "$ANDROID_RELEASE_STORE_PASSWORD" ]]; then
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "::error::Release APK publishing requires ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_KEY_ALIAS, ANDROID_RELEASE_KEY_PASSWORD, and ANDROID_RELEASE_STORE_PASSWORD secrets."
              exit 1
            fi

            echo "::warning::Signing secrets are not configured; building the Gradle default APK for CI inspection only."
            exit 0
          fi

          keystore_path="apps/mobile/android/app/multica-release.keystore"

          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          {
            echo "MULTICA_UPLOAD_STORE_FILE=multica-release.keystore"
            echo "MULTICA_UPLOAD_STORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD"
            echo "MULTICA_UPLOAD_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS"
            echo "MULTICA_UPLOAD_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD"
          } >> apps/mobile/android/gradle.properties

          node .github/scripts/configure-android-release-signing.mjs

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Package release APK
        run: |
          set -euo pipefail

          release_apk="$(find apps/mobile/android/app/build/outputs/apk/release -name '*release*.apk' ! -name '*unaligned*' | sort | head -n 1)"
          if [[ -z "$release_apk" ]]; then
            echo "::error::No release APK was produced."
            exit 1
          fi

          mkdir -p dist
          cp "$release_apk" dist/multica-android.apk
          apksigner verify --verbose --print-certs dist/multica-android.apk

      - name: Write APK metadata
        run: |
          cat > dist/multica-android.metadata.txt <<EOF
          package=ai.multica.mobile
          versionName=${{ steps.android_meta.outputs.version_name }}
          versionCode=${{ steps.android_meta.outputs.version_code }}
          apk=multica-android.apk
          EOF

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: multica-android-release-apk
          path: |
            dist/multica-android.apk
            dist/multica-android.metadata.txt
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/multica-android.apk
            dist/multica-android.metadata.txt
          prerelease: ${{ contains(steps.android_meta.outputs.version_name, '-') }}
          generate_release_notes: true
