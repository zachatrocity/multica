name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/android-debug-apk.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      APP_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write production env
        working-directory: apps/mobile
        run: |
          cat > .env.production.local <<EOF
          EXPO_PUBLIC_API_URL=${{ secrets.SELFHOSTED_API_URL }}
          EXPO_PUBLIC_WEB_URL=${{ secrets.SELFHOSTED_WEB_URL }}
          EOF

      - name: Generate Android native project
        working-directory: apps/mobile
        run: CI=1 pnpm exec dotenv -e .env.production.local -- cross-env APP_ENV=production expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          ./gradlew :app:dependencyInsight --dependency com.facebook.fbjni:fbjni --configuration releaseRuntimeClasspath
          ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: multica-android-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify release startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: mkdir -p apk && cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk apk/ && bash .github/scripts/android-startup-smoke.sh

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-diagnostics
          path: diagnostics
